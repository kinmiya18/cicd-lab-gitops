replicaCount: 1

# Jenkins rewrites the "tag" line below on every successful build (commit "ci: bump demo-app image tag to <sha>").
image:
  repository: docker.io/kienphamtrung/demo-app   # public Docker Hub repository
  tag: "6994b3a"
  pullPolicy: IfNotPresent

# Empty: the Docker Hub repository is public. Add a pull secret here for a private registry.
imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
